<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <title>Stats preview card component | Amy Lu</title>
</head>
<body>
  <div class="card">
    <div class="purple-picture">
      <picture>
        <source media="(min-width:768px)" srcset="images/image-header-desktop.jpg">
        <img class="mobile-photo" alt="header-photo" src="images/image-header-mobile.jpg">
      </picture> 
      <div class="purple"></div>
    </div>

    <div class="content-layout">
      <h1>Get <span class="highlight">insights</span> that help your business grow.</h1>
      <p class="content">
        Discover the benefits of data analytics and make better decisions regarding revenue, customer 
        experience, and overall efficiency.
      </p>
      <div class="stat-layout">
        <p class="stat"><span class="number special-number">10k+</span><br>companies</p>
        <p class="stat"><span class="number">314</span><br>templates</p>
        <p class="stat"><span class="number">12m+</span><br>queries</p>
      </div>
    </div>
  </div>

</body>
</html>
